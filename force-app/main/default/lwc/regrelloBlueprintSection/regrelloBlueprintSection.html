<template>
    <div class="section-card">
        <div class="section-header">
            <span class="chevron-icon" style={chevronStyle}></span>
            
            <div class="title-container">
                <span class="section-title">{title}</span>
            </div>
        
            <div class="starts-meta"> 
                <span class="starts-label">Starts </span>
                <template lwc:if={headerStartsReady}>
                    <span class={startsValueClass}>{startsLabel}</span>
                    
                    <template lwc:if={startsIsLink}>
                        <div class="header-starts-popover">
                            <div class="popover-content">
                                <div class="popover-row">
                                    <span class="popover-label">Starts</span>
                                    <span class="popover-value">after the following stage:</span>
                                </div>
                                <div class="popover-indent">
                                    <span class="popover-tag">Contract Generation and Approval</span>
                                </div>
                                <div class="popover-row">
                                    <span class="popover-label">if</span>
                                    <span class="popover-value">
                                        <span class="popover-tag">Proposed Contract Value</span> 
                                        &nbsp;is greater than or equal to <strong>$500,000.00</strong>
                                    </span>
                                </div>
                                <div class="popover-row">
                                    <span class="popover-label">or</span>
                                    <span class="popover-value">
                                        <span class="popover-tag">Finance Escalation Required</span> 
                                        &nbsp;is checked
                                    </span>
                                </div>
                            </div>
                        </div>
                    </template>
                </template>
                <template lwc:else>
                    <span class="starts-skeleton"></span>
                </template>
            </div>
        
            <div class="header-actions" role="toolbar">
                <button type="button" class="task-action-btn" title="Edit Section">
                    <span class="task-action-icon" style={editActionIconStyle}></span>
                </button>
                <button type="button" class="task-action-btn task-action-btn--delete" title="Delete">
                    <lightning-icon icon-name="utility:delete" size="xx-small" variant="base"></lightning-icon>
                </button>
            </div>
        </div>

        <div class="section-body">
            <template lwc:if={showSkeleton}>
                <div class="body-skeleton" aria-hidden="true"></div>
            </template>
            <template lwc:if={showRows}>
                <div class="rows-list">
                    <template for:each={rows} for:item="row">
                        <div key={row.key} class="task-row animate-in">
                            <div class="task-row-main">
                                <div class="task-left">
                                    <div class="task-circle" aria-hidden="true"></div>
                                    <div class="task-info">
                                        <p class="task-title">{row.title}</p>
                                        <p class="task-assignee-line">
                                            <span class="assigned-to">Assigned to</span>
                                            <span class={row.chipClass}>
                                                <template lwc:if={row.assigneeIconUsesLetter}>
                                                    <span
                                                        class={row.assigneeIconLetterClass}
                                                        aria-hidden="true"
                                                    >{row.assigneeIconLetter}</span>
                                                </template>
                                                <template lwc:else>
                                                    <span class="assignee-icon" style={row.iconStyle}></span>
                                                </template>
                                                {row.assigneeDisplay}
                                            </span>
                                        </p>
                                    </div>
                                </div>
                                <div class="task-timing">
                                    <div>
                                        <span class="timing-label">Starts </span>
                                        <span class="timing-value">{row.startsDetail}</span>
                                    </div>
                                    <div class="timing-ttc">
                                        <span class="timing-label">Time to complete </span>
                                        <span class="timing-value timing-value--bold">{row.timeToComplete}</span>
                                    </div>
                                </div>
                                <div
                                    class="task-row-actions"
                                    role="toolbar"
                                    aria-label={row.toolbarAriaLabel}
                                >
                                    <button
                                        type="button"
                                        class="task-action-btn"
                                        title="Edit"
                                        data-task-title={row.title}
                                        aria-label={row.editAriaLabel}
                                        onclick={handleEditTask}
                                    >
                                        <span class="task-action-icon" style={editActionIconStyle}></span>
                                    </button>
                                    <button
                                        type="button"
                                        class="task-action-btn"
                                        title="Open document"
                                        data-task-title={row.title}
                                        aria-label={row.documentAriaLabel}
                                    >
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M11 17H4C3.46957 17 2.96086 16.7893 2.58579 16.4142C2.21071 16.0391 2 15.5304 2 15V3C2 2.46957 2.21071 1.96086 2.58579 1.58579C2.96086 1.21071 3.46957 1 4 1H16V3H4V15H11V13L15 16L11 19V17ZM19 21V7H8V13H6V7C6 6.46957 6.21071 5.96086 6.58579 5.58579C6.96086 5.21071 7.46957 5 8 5H19C19.5304 5 20.0391 5.21071 20.4142 5.58579C20.7893 5.96086 21 6.46957 21 7V21C21 21.5304 20.7893 22.0391 20.4142 22.4142C20.0391 22.7893 19.5304 23 19 23H8C7.46957 23 6.96086 22.7893 6.58579 22.4142C6.21071 22.0391 6 21.5304 6 21V19H8V21H19Z" fill="currentColor"></path>
                                        </svg>
                                    </button>
                                    <button
                                        type="button"
                                        class="task-action-btn task-action-btn--delete"
                                        title="Delete"
                                        data-task-title={row.title}
                                        aria-label={row.deleteAriaLabel}
                                    >
                                        <lightning-icon
                                            icon-name="utility:delete"
                                            size="xx-small"
                                            alternative-text=""
                                            variant="base"
                                        ></lightning-icon>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>

    <template lwc:if={showEditModal}>
        <c-regrello-edit-modal
            open={showEditModal}
            task-name={modalTaskName}
            assignee-label={modalAssigneeLabel}
            assignee-name={modalAssigneeName}
            assignee-is-agent={modalAssigneeIsAgent}
            start-primary={modalStartPrimary}
            start-after-task={modalStartAfterTask}
            due-amount={modalDueAmount}
            due-unit={modalDueUnit}
            description-text={modalDescriptionText}
            onclose={handleEditModalClose}
            onsave={handleEditModalSave}
        ></c-regrello-edit-modal>
    </template>
</template>
