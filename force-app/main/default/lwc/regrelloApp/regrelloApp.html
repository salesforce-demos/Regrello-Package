<template>
    <div class="app-container">
        <!-- Sidebar -->
        <c-regrello-sidebar active-item-id="blueprints" config-name={configName} onblueprintsclick={handleBlueprintsClick}
            onsalesforceclick={handleSalesforceClick}></c-regrello-sidebar>

        <!-- Main content area -->
        <div class="main-content">
            <section class={blueprintsPanelClass}>
                <c-regrello-blueprints-header oncreateblueprint={handleOpenModal}></c-regrello-blueprints-header>
                <main class="main-scroll">
                    <c-regrello-empty-state oncreateblueprint={handleOpenModal}
                        oninvitepeople={handleBlueprintsClick}></c-regrello-empty-state>
                </main>
            </section>

            <template lwc:if={shouldRenderGenerateScreen}>
                <section class={generatePanelClass}>
                <main class="main-full">
                    <c-regrello-generate-blueprint
                        config-name={configName}
                        onopenblueprintdetail={handleOpenBlueprintDetail}></c-regrello-generate-blueprint>
                </main>
                </section>
            </template>

            <template lwc:if={shouldRenderDetailScreen}>
                <section class={detailPanelClass}>
                <main class="main-full">
                    <c-regrello-supplier-blueprint
                        blueprint-title={blueprintDetailTitle}
                        config-name={configName}></c-regrello-supplier-blueprint>
                </main>
                </section>
            </template>
        </div>

        <!-- Create blueprint modal (overlay) -->
        <template lwc:if={createBlueprintOpen}>
            <c-regrello-create-modal onclose={handleCloseModal} onchooseai={handleChooseAi}></c-regrello-create-modal>
        </template>
    </div>
</template>
